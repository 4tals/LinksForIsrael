name: Validate Data, Tests & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate open civic data & HSDS feed
        run: npm run generate-open-data

      - name: Validate JSON schema (#293)
        run: npm run validate

      - name: Run unit & integrity tests (#228)
        run: npm test

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx next lint --max-warnings=0
